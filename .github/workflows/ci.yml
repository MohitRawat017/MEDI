name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run live integration tests (needs GROQ_API_KEY + PINECONE_API_KEY secrets)"
        type: boolean
        default: false

jobs:
  backend:
    name: Backend (compile + logic tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only the light deps the logic tests import - no torch/models needed
      - name: Install test dependencies
        run: pip install -q requests python-dotenv langchain-core langchain-groq

      - name: Syntax check all modules
        run: python -m compileall modules routes tests

      - name: Run logic tests
        run: python tests/test_logic.py

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  live-tests:
    name: Live integration tests (manual)
    # Only runs on an explicit workflow_dispatch with run_live=true.
    # The secrets themselves are checked inside the job (the secrets context
    # is not available in job-level `if` conditions).
    if: github.event_name == 'workflow_dispatch' && inputs.run_live == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check required secrets
        id: check
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          echo "ready=$([ -n "$GROQ_API_KEY" ] && [ -n "$PINECONE_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install test dependencies
        run: pip install -q requests python-dotenv langchain-core langchain-groq pinecone

      - name: Run live evaluation (RxNorm/DailyMed grounding)
        if: steps.check.outputs.ready == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: PYTHONIOENCODING=utf-8 python tests/test_evaluation.py

      - name: Test Groq LLM connection
        if: steps.check.outputs.ready == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python tests/test_llm.py

      - name: Test Pinecone connection
        if: steps.check.outputs.ready == 'true'
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          python - <<'EOF'
          import os
          import sys
          sys.path.insert(0, ".")
          from modules.config import PINECONE_INDEX_NAME
          from pinecone import Pinecone
          pc = Pinecone(api_key=os.environ["PINECONE_API_KEY"])
          indexes = [i["name"] for i in pc.list_indexes()]
          print("Pinecone indexes:", indexes)
          assert PINECONE_INDEX_NAME in indexes, f"expected index: {PINECONE_INDEX_NAME}"
          EOF

      - name: Warn if secrets are not configured
        if: steps.check.outputs.ready != 'true'
        run: |
          echo "::warning::GROQ_API_KEY and/or PINECONE_API_KEY are not configured as repo secrets."
          echo "Add them under Settings > Secrets and variables > Actions, then re-run."
