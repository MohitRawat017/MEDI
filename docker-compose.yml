services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Compose reads these from the repo-root .env (optional; unset -> empty)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_ENV: ${PINECONE_ENV:-us-east-1}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-medi}
      # Override the config.py defaults for the container layout
      UPLOAD_DIR: /app/uploaded_pdfs
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    volumes:
      - hf-cache:/app/.cache/huggingface
      - uploads:/app/uploaded_pdfs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  hf-cache:
  uploads:
