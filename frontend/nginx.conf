server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API routes are proxied to the backend service so the browser
    # only ever talks to this origin (no CORS needed in production).
    location /upload_prescription/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 20m;
    }
    location /ask_prescription/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /upload_pdfs/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 50m;
    }
    location /ask/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
